<!-- Snippet: Formulaire de commande de semences / Inscription formation -->
<form class="card" style="max-width: 520px;">
  <h3 class="card-title" style="margin-bottom: var(--space-4);">Commande de Semences &amp; Conseil</h3>
  
  <div class="form-group">
    <label for="producer-name" class="form-label">
      Nom du producteur / Maraîcher <span class="required">*</span>
    </label>
    <input type="text" id="producer-name" name="name" class="form-input" placeholder="Ex: Bakary Coulibaly" required />
    <p class="form-hint">Nom du responsable d'exploitation maraîchère.</p>
  </div>

  <div class="form-group">
    <label for="variety-choice" class="form-label">
      Variété sélectionnée <span class="required">*</span>
    </label>
    <select id="variety-choice" name="variety" class="form-select" required>
      <option value="">Sélectionner une variété paysanne...</option>
      <option value="gombo-clemson">Gombo Clemson Spineless (Reproductible)</option>
      <option value="tomate-roma">Tomate Roma Sélection Sahel (Bio)</option>
      <option value="oignon-galmi">Oignon Violet de Galmi (Acclimaté)</option>
      <option value="piment-habanero">Piment Habanero Jaune</option>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Plan de culture ou relevé de sol (optionnel)</label>
    <div class="form-file-dropzone">
      <div class="dropzone-title">📄 Déposer un plan de parcelle (PDF, JPG)</div>
      <div class="dropzone-sub">Glisser-déposer ou cliquer pour parcourir (max 10 Mo)</div>
    </div>
  </div>

  <div style="display: flex; gap: var(--space-3); margin-top: var(--space-6); justify-content: flex-end;">
    <button type="button" class="btn btn-secondary">Annuler</button>
    <button type="submit" class="btn btn-primary">Valider la commande</button>
  </div>
</form>
